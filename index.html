<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CATCHES</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				darkMode: "class",
				theme: {
					extend: {
						fontFamily: {
							sans: ["Inter", "sans-serif"],
							serif: ["Merriweather", "serif"],
							mono: ["JetBrains Mono", "monospace"],
						},
						colors: {
							paper: "#fafafa", // Clean light grey
							ink: "#0a0a0a", // Near black
							monstera: {
								50: "#fafafa",
								100: "#f5f5f5",
								200: "#e5e5e5",
								300: "#d4d4d4",
								400: "#a3a3a3",
								500: "#737373",
								600: "#525252",
								700: "#404040",
								800: "#262626",
								900: "#171717",
							},
						},
					},
				},
			};
		</script>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Merriweather:wght@400;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--app-bg: #fafafa;
				--sidebar-bg: #ffffff;
				--accent: #525252;
				--text-main: #0a0a0a;
			}

			body {
				font-family: "Inter", sans-serif;
				background-color: var(--app-bg);
				color: var(--text-main);
				-webkit-font-smoothing: antialiased;
				transition: background-color 0.3s ease, color 0.3s ease;
			}

			/* Refined custom scrollbar */
			::-webkit-scrollbar {
				width: 8px;
				height: 8px;
			}
			::-webkit-scrollbar-track {
				background: transparent;
			}
			::-webkit-scrollbar-thumb {
				background: #a3a3a3;
				border-radius: 20px;
				border: 2px solid var(--app-bg);
			}
			::-webkit-scrollbar-thumb:hover {
				background: #737373;
			}

			@keyframes slideUpFade {
				from {
					opacity: 0;
					transform: translateY(12px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
			.animate-fadeIn {
				animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
			}

			@keyframes fade {
				from {
					opacity: 0;
				}
				to {
					opacity: 1;
				}
			}
			.animate-fade {
				animation: fade 0.3s ease-out forwards;
			}

			.custom-scrollbar::-webkit-scrollbar {
				width: 4px;
			}
			.custom-scrollbar::-webkit-scrollbar-track {
				background: transparent;
			}
			.custom-scrollbar::-webkit-scrollbar-thumb {
				background: #d4d4d4;
				border-radius: 10px;
			}
			.custom-scrollbar::-webkit-scrollbar-thumb:hover {
				background: #a3a3a3;
			}

			/* Transitions for interactive elements */
			button,
			input,
			select,
			textarea,
			.card {
				transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
			}

			.glass-card {
				background: rgba(255, 255, 255, 0.8);
				backdrop-filter: blur(12px);
				border: 1px solid rgba(255, 255, 255, 0.6);
			}
		</style>
	</head>
	<body class="overflow-hidden">
		<div id="root"></div>
		<script type="module" src="/index.tsx"></script>
	</body>
</html>
